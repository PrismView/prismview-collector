name: CI

on:
  pull_request:
    branches: [main]      # main으로 향하는 PR마다
  push:
    branches: [main]      # main에 머지된 직후에도 한 번 더

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 코드 받기
        uses: actions/checkout@v7

      - name: Java 21 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 준비 (의존성 캐시)
        uses: gradle/actions/setup-gradle@v6

      - name: 테스트
        run: ./gradlew test