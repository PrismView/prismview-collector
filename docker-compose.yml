services:                       # 띄울 컨테이너 목록. 지금은 PostgreSQL 하나
  postgres:                     # 서비스 이름 (compose 안에서 부르는 별명)
    image: postgres:17          # 17로 버전 고정. latest를 쓰면 몇 달 뒤 메이저 버전이 바뀌어 기존 데이터를 못 읽을 수 있음
    container_name: prismview-postgres   # docker ps, docker exec에서 쓸 이름. 안 쓰면 자동으로 긴 이름이 붙음

    environment:                # 컨테이너 안 PostgreSQL에 넘기는 설정값 (처음 실행할 때만 적용됨)
      POSTGRES_DB: prismview          # 처음 만들어질 DB 이름
      POSTGRES_USER: prismview        # 접속할 사용자 이름
      POSTGRES_PASSWORD: pv0110248    # 비밀번호. 이게 없으면 컨테이너가 시작되지 않음 (로컬 개발용이라 단순하게)

    ports:
      - "5432:5432"             # 내 맥 5432 → 컨테이너 5432. 이게 있어야 pgAdmin, Spring 앱이 localhost로 접속 가능

    volumes:
      - prismview-pgdata:/var/lib/postgresql/data   # 컨테이너 밖 볼륨을 PostgreSQL 데이터 폴더에 연결. 컨테이너를 지워도 데이터가 남음 (17 기준 경로)

volumes:                        # 위에서 쓴 볼륨을 여기서 선언해야 Docker가 만들어 줌
  prismview-pgdata:

#   prismview-pgdata : /var/lib/postgresql/data
# └ 볼륨 이름        └ 컨테이너 안의 경로
#   (Docker가 관리)    (PostgreSQL이 데이터를 쓰는 폴더)