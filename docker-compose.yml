services:
  postgres:
    image: postgres:16-alpine
    container_name: prismview-postgres
    environment:
      POSTGRES_DB: prismview
      POSTGRES_USER: prismview
      POSTGRES_PASSWORD: prismview
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prismview -d prismview"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
