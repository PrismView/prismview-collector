spring:
  application:
    name: collector
  datasource:
    url: ${DB_URL}              # 어떤 DB에 붙을지 (값은 환경별 파일이나 환경변수에서)
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

okx:
  base-url: https://www.okx.com
  rate-limit:
    min-interval: 125ms    # history-candles 2초당 20회(IP 기준)의 80% = 초당 8회
  retry:
    max-attempts: 5        # 일시 오류 시 최대 시도 횟수
    initial-delay: 1s      # 첫 재시도 대기 (이후 2배씩, 최대 30초)
  backfill:
    inst-ids: BTC-USDT-SWAP,ETH-USDT-SWAP