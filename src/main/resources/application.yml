spring:
  application:
    name: prismview-collector
  datasource:
    url: jdbc:postgresql://localhost:5432/prismview
    username: prismview
    password: prismview
  flyway:
    enabled: true

prismview:
  collector:
    instruments:
      - BTC-USDT-SWAP
      - ETH-USDT-SWAP
    source-timeframe: 1s
    target-timeframe: 30s
    backfill-months: 3
    okx:
      base-url: https://www.okx.com
      history-path: /api/v5/market/history-candles
      limit: 100
